ng{font-size:13px;display:block}.agenda p{font-size:12px;color:var(--muted);margin:3px 0 0}.agenda small{font-size:11px;color:#6a7d6d}.bottom-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.slide{min-height:290px;display:flex;flex-direction:column;justify-content:center;padding:35px;background:#f7f8f2;border:1px solid #e8eddf;border-radius:12px}.slide h2{font-size:25px;line-height:1.65;margin-top:12px}.slide p{font-size:17px;line-height:2.1}.slide-count{font:12px Arial;color:#74916d;direction:ltr}.slide-controls{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:9px}.coach-note{padding:17px 20px;background:#fcf6e7;border-radius:9px;font-size:12px;margin-top:18px}.answer{padding:18px;background:#eaf4e5;border-radius:9px;margin-top:14px;font-size:13px}.hidden{display:none!important}.audio-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.audio-list button{padding:8px 12px;border:1px solid var(--line);background:#f8faf5;border-radius:7px;font:12px Arial}.audio-list button.active{border-color:#6b956e;background:#eef5e8}audio{width:100%;margin:15px 0}.listen-points{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.listen-points>div{padding:18px;background:#f4f6ef;border-radius:9px}.listen-points b{display:block;font-size:13px;margin-bottom:7px}.listen-points p{font-size:12px;color:var(--muted);margin:0}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}.role-grid article{padding:22px;background:#eef3e9;border-radius:10px}.role-grid article:last-child{background:#f8efdf}.role-grid p{font-size:14px}.objection{border:1px solid #e4d9bc;background:#fcf8ee;padding:18px;border-radius:9px}.objection p{margin:10px 0}.eval-meta{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}label{display:grid;font-size:12px;gap:7px}input,textarea{width:100%;border:1px solid #d8e0d3;padding:11px 12px;border-radius:7px;background:#fcfdf9;color:var(--ink)}textarea{min-height:8 {display:none}.portal strong{font-size:10px}.portal small{display:none}.session-banner{align-items:start;gap:10px}.session-banner h1{font-size:22px}.session-banner p{font-size:11px}.timer{min-width:82px;padding-inline-start:12px}.timer output{font-size:25px}.timerbuttons{flex-direction:column}.panel{padding:20px 17px}.tabs{margin-top:15px;gap:0}.tabs button{padding:10px 9px}.role-grid,.eval-meta,.feedback-fields{grid-template-columns:1fr}.slide{padding:22px;min-height:280px}.slide h2{font-size:21px}.slide p{font-size:15px}.agenda>div{gap:8px;grid-template-columns:24px 1fr auto}.sectionhead{align-items:start}.rating-options{width:100%}.rating-options button{flex:1;padding:8px 7px}.presenting .slide h2{font-size:25px}.presenting .slide p{font-size:19px}.badge{font-size:9px}.button{font-size:12px}}@media print{body>*{display:none!important}.print-report{display:block!important;font:14px/1.9 Tahoma,Arial;color:#111;padding:20px}.print-report h1{font-size:24px}.print-report table{width:100%;border-collapse:collapse;margin:20px 0}.print-report th,.print-report td{border:1px solid #bbb;padding:10px;text-align:start}.print-report p{white-space:pre-wrap}.print-report .report-summary{background:#eee;padding:15px}}
</style></head><body><header><div class="brand"><span class="logo">51Talk</span><span class="label" id="brandLabel"></span></div><div class="topactions"><span class="badge" id="previewBadge"></span><button class="button secondary" id="languageButton">English</button></div></header><div class="layout"><aside><span class="eyebrow">TRAINER WORKSPACE</span><h2 id="asideTitle"></h2><nav class="portals" id="portals"></nav><p class="sidebar-note" id="sidebarNote"></p></aside><main><section class="session-banner"><div><span class="eyebrow" id="bannerTag"></span><h1 id="chapterTitle"></h1><p id="chapterLead"></p></div><div class="timer"><small id="timerLabel"></small><output id="clock">25:00</output><div class="timerbuttons"><button id="timerToggle"></button><button id="timerReset"></button></div></div></section><nav class="tabs" id="tabs"></nav><div id="content"></div></main></div><p class="preview-note" id="previewNote"></p><footer>51Talk · Team Leader Training Preview</footer><button class="button secondary exit-display hidden" id="exitDisplay"></button><section class="print-report" id="printReport"></section><script>const CURRICULUM={"modules":[{"id":"thirdcall","icon":"☎","title":"المكالمة الثالثة: شرح التقييم","time":"10 دقائق","desc":"ملخص تدريبي لمناقشة تجربة الدرس التقييمي وما بعدها.","lead":"ملخص محرر من دليلي التدريب العربي والإنجليزي المقدمين من قائد الفريق. ارجع إلى الملف الأصلي للتفاصيل، وتحقق من الوقائع قبل أي وعد للمتعلّم.","lessons":[["اسأل عن تجربة الدرس","ابدأ بسؤال مفتوح عن المدرّس ومدى مناسبة الدرس للمتعلّم. استمع للإجابة وسجل أي مشكلة أو تحفظ قبل الانتقال إلى النتائج."],["ابدأ بما نجح ثم ناقش ما يحتاج تطويرًا","اذكر نقاط قوة محددة ظهرت في الدرس، ثم ناقش ملاحظات قابلة للتطوير مستندة إلى التقييم الفعلي. تجنب الافتراضات العامة أو إصدار حكم على المستوى من انطباعك وحده."],["اربط الملاحظات بهدف المتعلّم","ناقش المهارات ذات الصلة بهدفه مثل المحادثة والاستماع والنطق والمفردات والقواعد، مع أمثلة من تجربته إذا كانت متاحة. اسأله إن كانت الملاحظات تعكس ما يواجهه فعلاً."],["اتفق على خطوة واضحة","اشرح كيف يمكن للتدريب والممارسة أن يساعداه وفق الخيارات المتاحة فعلًا. إذا كان تقرير التقييم متاحًا ومعتمدًا، أرسله أو حدّد موعد إرساله؛ لا تعد بتقرير آلي أو بنتيجة مضمونة دون تحقق. ناقش الاشتراك بعد فهم الطالب للقيمة ورغبته في المتابعة."]],"question":"ما أفضل بداية لمكالمة شرح التقييم بعد الدرس؟","choices":["البدء بعيوب الطالب وعرض الاشتراك","سؤال الطالب عن تجربة الدرس ثم مناقشة نقاط قوة وملاحظات موثقة","وعده بتقرير آلي وخطة مضمونة"],"answer":1},{"id":"firstcall","icon":"☎","title":"مكالمة التقييم الأولى","time":"12 دقيقة","desc":"ملخص عملي للمستشار التعليمي قبل الحصة التجريبية.","lead":"مبني على النسختين العربية والإنجليزية المقدمتين للمراجعة؛ راجع الملف الأصلي بلغتك للتفاصيل.","lessons":[["ابدأ بوضوح وهدوء","عرّف بنفسك وبـ51Talk، ووضّح سبب الاتصال وعلاقته بالحصة التجريبية. أكد الموعد بطريقة مريحة دون استعجال."],["استكشف المهارات والراحة في الحديث","اسأل عن تقييم المتعلّم لمستواه، وفهمه للمسموع، وسهولة التعبير والقراءة والكتابة. تعامل مع الإجابات بوصفها وصفًا ذاتيًا، لا تشخيصًا نهائيًا. اترك مساحة للإجابة ولا تفترض وجود قلق أو ضعف."],["افهم الهدف والسياق","اسأل أين يحتاج الإنجليزية في العمل أو الحياة، وما الهدف الذي يريد تحقيقه، وما الذي لم يناسبه في التجارب السابقة. استخدم أسئلة حساسة عن الفرص الضائعة أو المال فقط إذا بادر بها العميل أو سمح السياق."],["اختم بخطوة مناسبة","لخّص ما سمعته بكلمات المتعلّم، تحقق من صحة فهمك، ثم اشرح الخطوة التالية وما تستطيع تأكيده دون وعود غير متحققة."]],"question":"بعد أن يشرح المتعلّم هدفه وصعوبته، ما الخطوة الأفضل؟","choices":["الانتقال مباشرة إلى عرض عام","تلخيص ما قاله والتحقق من فهمه قبل شرح الخطوة المناسبة","الافتراض أن مستواه تحدد نهائيًا من المكالمة"],"answer":1},{"id":"secondcall","title":"المكالمة الثانية","lead":"تجهيز الطالب قبل الحصة التجريبية عبر ٧ مراحل واضحة. ملخص وسكريبت تدريبيان مبنيان على دليل 2nd Call ومقارنة مكالمتي دانية وفهد.","lessons":[["١ · الترحيب وكسر الجليد","ابدأ بترحيب دافئ واستخدم اسم الطالب. اربط الاتصال بتجهيز حصته، واحترم وقته. حافظ على نبرة ودية ومهنية تناسب الشخص."],["٢ · التحقق التقني والتحضير","اسأل الطالب هل سيحضر من الهاتف أو الآيباد أو الكمبيوتر، واقترح شاشة أكبر مثل الآيباد أو اللابتوب إذا توفرت. تأكد من تحميل التطبيق وتسجيل الدخول. وجّه الطالب: الصفحة الرئيسية ← تفاصيل الدورة ← أسئلة المعاينة والتحضير. ذكّره بالاستماع للمفردات وتجربة نطقها بالمايك. إذا توقف عند البريد وكان خيار Skip متاحًا في الواجهة، يمكنه استخدامه لإكمال الدخول."],["٣ · شرح هدفي الحصة","وضّح أن هذه حصة تجريبية للتعرّف على بيئة التعلم وتقييم المستوى، وليست درسًا تعليميًا تقليديًا. شجعه على التحدث بما يعرفه حتى لو أخطأ ليعكس التقييم قدرته الحالية."],["٤ · الخصوصية والكاميرا والمايك","تعامل مع مخاوف الخصوصية باحترام. يقدّم الدليل الكاميرا كخيار للطالب مع ضرورة تشغيل المايك للتواصل والتقييم. اشرح إعدادات الأذونات، واستخدم صياغة سياسة الخصوصية المعتمدة عند الإجابة عن التسجيل أو استخدام الصورة."],["٥ · تثبيت وقت الدخول","بحسب الدليل، الدخول يكون قبل الحصة بخمس دقائق: حصة 20:30 تعني دخول 20:25. لا تطلب الانتظار داخل الفصل مبكرًا؛ إذا دخل الطالب قبل الوقت فوضّح متى يخرج ويعود. اطلب منه إعادة وقت الدخول للتأكد من فهمه."],["٦ · توضيح قيمة المكالمة الثالثة","اذكر أن هناك تواصلًا بعد الحصة لمراجعة التجربة، ومناقشة نقاط القوة وما يحتاج تطويرًا، وربط الخطوة التالية بهدف الطالب في الحياة أو العمل. شرح الفائدة أوضح من ذكر اسم المكالمة فقط."],["٧ · صاحب القرار المالي والختام","اسأل بلطف عمّن يتولى قرار الاشتراك والدفع حتى يكون النقاش التالي مع الشخص المناسب. إذا ربطت السؤال بميزة تسجيل مباشر، فتحقق من وجود العرض وشروطه. اختم بتأكيد الجاهزية ووقت الدخول والتواصل بعد الحصة."]]}],"enModules":{"welcome":{"title":"Welcome to 51Talk","desc":"Understand the learner journey and your part in a helpful first experience.","lead":"Start with the learner’s journey, from first contact to the start of learning.","lessons":[["What do we offer?","51Talk is an English learning platform. Share only information you can verify, and check details before making a promise."],["Your first step","Listen to the learner’s goal, record what they say clearly, and help them understand an appropriate next step."]],"question":"What is a good first step with a new learner?","choices":["Offer a package immediately","Understand their goal and situation first","Assume every learner has the same goal"]},"tools":{"title":"Tools and workflow","desc":"Review the learner record, verify current status, and document the next step.","lead":"Read the current record and prior contact history before taking action.","lessons":[["Review the context","Confirm the learner’s identity, trial stage, last documented contact, and any open follow-up."],["Document clearly","Record the request, agreed action, owner, and expected follow-up time. Do not record an unapproved promise."]],"question":"Which note is most useful after a call?","choices":["Contacted","The learner had a scheduling problem; we agreed to review a suitable option tomorrow","Very interested, with no details"]},"discovery":{"title":"Understand learner needs","desc":"Use open questions to learn about goals, level, and obstacles.","lead":"Let the learner explain in their own words why English matters to them.","lessons":[["Ask and listen","Ask where they need English, which situation they want to handle confidently, and what has made learning difficult before."],["Connect the next step to the need","Summarize what you heard before explaining an option: “You need to speak more confidently in meetings, correct?”"]],"question":"Which question best explores a learner’s need?","choices":["Will you subscribe today?","Where specifically do you need English at work or in life?","Your goal must be travel, right?"]},"trial":{"title":"Follow up after the trial lesson","desc":"Ask about the lesson, address difficulties, and agree on a clear next step.","lead":"Begin with the learner’s actual lesson experience.","lessons":[["Ask for their view","How was the lesson? What helped? What did not work for you?"],["Handle the obstacle","If there was a technical or learning issue, understand and document it, then agree on a follow-up before discussing enrollment."]],"question":"The learner says the teacher spoke too quickly. What do you do first?","choices":["Ignore it and ask for payment","Ask for details and agree on suitable follow-up","Promise an immediate teacher change without checking"]},"service":{"title":"Service and problem solving","desc":"Listen, document, own the follow-up, and confirm the outcome.","lead":"Sending an issue to someone else does not by itself resolve it.","lessons":[["Understand the impact","Ask what happened, when it happened, and how it affected the learner. Do not assume the cause."],["Close the loop","Agree on who will follow up and when, verify the outcome, and update the learner."]],"question":"When can a problem follow-up be closed?","choices":["As soon as it is forwarded","After the result is verified and communicated to the learner","After one day passes"]},"practice":{"title":"Practice and simulation","desc":"Practice a short conversation from opening to next step.","lead":"Use a fictional scenario without real customer data.","lessons":[["Scenario","A learner attended a trial lesson. They need English for work meetings but found the explanations too fast."],["Your task","Ask about the lesson, summarize the need, address the difficulty, and agree on a realistic follow-up. Practice with your team leader."]],"question":"What is the best sequence?","choices":["Price → payment → ask about the goal","Lesson experience → need → obstacle → next step","Ask for a referral → end the call"]},"review":{"title":"Review your performance","desc":"Pick one skill to improve using documented work examples.","lead":"Start with a real baseline so progress is observable.","lessons":[["Review a work example","Choose a relevant past interaction. Identify the learner’s need, what was agreed, and how follow-up was documented."],["Choose one focus","Write one specific behavior to improve in the next conversation and discuss it with your team leader."]],"question":"Which improvement goal is most useful?","choices":["Improve everything immediately","Summarize the learner’s need before suggesting a next step","Ignore past feedback"]},"complex":{"title":"Complex service situations","desc":"Separate facts, impact, action, and follow-up.","lead":"Do not rush to explain the cause or make a promise you cannot verify.","lessons":[["Separate facts from assumptions","Ask what happened and when. Explain what you can verify and what needs follow-up."],["Own the action","Agree on an action, an owner, and a time to update the learner. Follow through to the result."]],"question":"A learner reports a repeated problem. What should you do?","choices":["Assume it is identical without checking","Review new facts and past follow-up before deciding the next action","Ask them to ignore it"]},"coaching":{"title":"Short development plan","desc":"Turn feedback into practice and a review with your team leader.","lead":"Choose one situation to practice, then review what changed.","lessons":[["Set a practical exercise","For example, ask two open questions about a learner’s need and summarize the answer before offering a solution."],["Review the result","Discuss what worked, what remains unclear, and what to change next time."]],"question":"What makes a development plan actionable?","choices":["A broad goal without an example","A specific behavior, practice, and review","Changing every step at once"]},"thirdcall":{"title":"Third call: explaining the assessment","desc":"A training summary for discussing the trial lesson and next steps.","lead":"Edited from the Arabic and English training PDFs supplied by the team leader. Check the original for detail and verify facts before promising anything to the learner.","lessons":[["Ask about the lesson experience","Open with a question about the teacher and whether the lesson felt like a good fit. Listen to any concern before discussing results."],["Start with strengths, then development areas","Name strengths shown in the lesson, then discuss improvement areas supported by the actual assessment. Avoid generic assumptions or treating your impression as a final level diagnosis."],["Connect the assessment to the learner’s goal","Discuss relevant skills such as conversation, listening, pronunciation, vocabulary, and grammar, using examples from their experience when available. Ask whether the observations match what they feel."],["Agree on a clear next step","Explain the practice options actually available. If an assessment report is available and approved, send it or set a time to do so. Do not promise an AI report or guaranteed result without verification. Discuss enrollment once the learner understands the value and wants to continue."]],"question":"How should you open the assessment explanation after the lesson?","choices":["Lead with weaknesses and a subscription pitch","Ask about the lesson experience, then discuss evidence-backed strengths and development areas","Promise an AI report and guaranteed plan"]},"firstcall":{"title":"The first assessment call","desc":"A practical summary for education consultants before the trial lesson.","lead":"Based on the Arabic and English PDFs provided for review. Read the original in your preferred language for full detail.","lessons":[["Open clearly and calmly","Introduce yourself and 51Talk, explain why you are calling, and connect the call to the trial lesson. Confirm the appointment without rushing."],["Explore skills and comfort","Ask how the learner describes their level, listening, speaking, reading, and writing. Treat answers as self-report, not a final assessment. Give them time to respond."],["Understand goals and context","Ask where they use English, what they hope to achieve, and what did not work in past learning. Ask sensitive questions about missed opportunities or finances only when the learner’s own context makes them appropriate."],["Agree on a suitable next step","Summarize the learner’s words, check your understanding, and explain only next steps you can verify."]],"question":"After the learner explains a goal and a difficulty, what should you do?","choices":["Move directly to a generic pitch","Summarize and confirm your understanding before explaining a suitable next step","Assume the call established their level definitively"]},"secondcall":{"title":"Second Call","lead":"Prepare the learner for the trial lesson through seven clear stages. This training summary and script are based on the 2nd Call guide and its comparison of Dania’s and Fahad’s calls.","lessons":[["1 · Warm opening","Welcome the learner by name, connect the call to preparing for their lesson, and respect their time. Keep your tone friendly, professional, and appropriate to the individual."],["2 · Technical readiness and preparation","Ask whether the learner will attend on a phone, iPad, or computer. Recommend a larger screen, such as an iPad or laptop, if available. Confirm the app is installed and the learner is signed in. Guide them through Home → Course details → Preview and preparation questions. Remind them to listen to vocabulary and practice pronunciation using the microphone. If the email screen offers Skip, they can use it to continue."],["3 · Explain the two lesson goals","Explain that the trial introduces the learning environment and assesses the learner’s level; it is not a conventional teaching lesson. Encourage them to use the English they know, including making mistakes, so the assessment reflects their current ability."],["4 · Privacy, camera, and microphone","Respect privacy concerns. The guide presents camera use as optional while the microphone is needed for speaking and assessment. Explain permission settings and use the approved privacy wording when answering questions about recording or image use."],["5 · Confirm the entry time","Under the guide, enter five minutes before the lesson: a 20:30 lesson means joining at 20:25. Do not ask the learner to wait inside the classroom too early. If they have already entered, explain when to leave and rejoin. Ask them to repeat the entry time to check understanding."],["6 · Explain the third call’s value","Explain that after the lesson you will review the experience, discuss strengths and development areas, and connect the next step to the learner’s personal or work goals. Explain the benefit rather than only naming the call."],["7 · Payment decision-maker and closing","Politely ask who handles the enrollment decision and payment so the right person can join the follow-up. If you mention a direct-enrollment benefit, verify that the offer and its terms are available. Close by confirming readiness, entry time, and the follow-up."]]}},"questions":{"thirdcall":[{"q":"قال الطالب إن المعلم تكلم بسرعة ولم يستفد من الدرس. كيف تبدأ المكالمة الثالثة؟","o":["تشرح التقرير قبل سماع التفاصيل.","تسأل كيف شعر وأين كانت السرعة مؤثرة، ثم تقرّ بالملاحظة وتراجعها.","تخبره أن المشكلة في مستواه."],"e":"التغذية الراجعة من الطالب تسبق تحليلك؛ فهم المثال والأثر يحمي الثقة ويساعد على متابعة مناسبة.","a":1},{"q":"التقييم يظهر دافعًا قويًا وترددًا في المحادثة. أي عرض للنتيجة هو الأفضل؟","o":["تذكر الدافع نقطة قوة، تشرح التردد بمثال محدد، وتقترح تدريبًا تدريجيًا.","تقول إن التردد سيختفي تمامًا خلال أسبوع.","تبدأ بقائمة الأخطاء لتثبت دقة التقييم."],"e":"الدليل يبدأ ببناء الثقة، ثم يعرض حاجة قابلة للتطوير وخطوة عملية دون مبالغة.","a":0},{"q":"الطالب يفهم الفكرة العامة بالإنجليزية لكنه لا يجد الكلمات للرد بسرعة. ما التفسير والخطوة الأنسب؟","o":["نطالبه بحفظ قوائم طويلة من الكلمات وحده.","يعني أنه لا يفهم شيئًا؛ نعيده للصفر.","هناك فجوة بين الفهم والاستجابة؛ نربطها بالممارسة والتكرار قبل الدرس وأثناءه وبعده."],"e":"الدليل يميز الفهم من سرعة الاستجابة، ويعالج الفجوة بالممارسة والتكرار المنتظم.","a":2},{"q":"بعد عرض تقرير التقييم قال الطالب: «هل هذا يعني أنني ضعيف؟». ما الرد الأنسب؟","o":["نعم، لذلك يجب أن تشترك الآن.","التقييم يوضح أين أنت الآن وما نقاط قوتك، ثم نبني مسارًا نحو هدفك ونراجع ما يحتاج تطويرًا.","لا توجد أي نقاط تحتاج تطويرًا."],"e":"التقييم ليس حكمًا على الشخص؛ يوازن الواقع مع نقاط القوة والهدف والخطة.","a":1},{"q":"ما مصدر ملاحظاتك عن نقاط القوة والتطوير؟","o":["انطباعك عن عمر الطالب","نفس النص لكل الطلاب","التقييم الفعلي وأمثلة تجربة الدرس"],"a":2,"e":"ملخص المكالمة الثالثة يشترط ملاحظات مستندة إلى التقييم الفعلي."},{"q":"كيف تربط النطق بهدف المتعلم؟","o":["تعده بلكنة مثالية بعد حصة","تناقش أمثلة ذات صلة بالمواقف التي يحتاجها","تسرد كل أخطاء النطق دون سياق"],"a":1,"e":"المهارات تناقش وفق هدف الطالب وبأمثلة متاحة من تجربته."},{"q":"طالب ينسى الكلمات بسرعة. ما المقترح المناسب؟","o":["مراجعة كلمات يستخدمها في جمل ومحادثات","حفظ قائمة طويلة دون استخدام","التوقف عن المحادثة حتى يحفظ القاموس"],"a":0,"e":"رد نسيان الكلمات يعتمد الاستخدام العملي والمراجعة داخل سياق."},{"q":"طالب يخاف من الخطأ أثناء الكلام. كيف تساعده؟","o":["تقاطعه عند كل كلمة","تطالبه بمحادثة صعبة فورًا","تبدأ بمحادثات قصيرة وتمنحه وقتًا ثم تزيد التحدي"],"a":2,"e":"رد الخجل يبني الراحة تدريجيًا ويعامل الخطأ كجزء من التعلم."},{"q":"طالب يقول لا أستطيع تركيب جملة. بماذا تبدأ؟","o":["تؤكد له أنه لا يصلح للتعلم","جمل قصيرة مرتبطة بمواقف تهمه ثم البناء عليها","قواعد متقدمة دون ممارسة"],"a":1,"e":"رد تكوين الجمل يبدأ من تعبير بسيط له معنى للطالب."},{"q":"كيف تتعامل مع ضيق الوقت؟","o":["تراجع المواعيد ومدة الحصة المتاحة وتختار انتظامًا واقعيًا","تعده بأي موعد دون تحقق","تعتبر ضيق الوقت رفضًا نهائيًا"],"a":0,"e":"رد ضيق الوقت يربط الجدول بالمتاح فعليًا والقدرة على الالتزام."},{"q":"متى تعد بإرسال تقرير التقييم؟","o":["في كل الحالات ولو لم تعرف توفره","فقط إذا ضمن الطالب الاشتراك أولًا","عندما يكون متاحًا ومعتمدًا مع تحديد موعد واضح"],"a":2,"e":"الملخص يربط إرسال التقرير بالتوفر والاعتماد دون وعد غير متحقق."},{"q":"طالب يخشى البدء ثم الانقطاع. ما الخطوة المناسبة؟","o":["إخفاء أهمية الممارسة المنتظمة","هدف صغير وجدول مناسب ومراجعة ما عطله سابقًا","ضمان استمراره تلقائيًا"],"a":1,"e":"رد الخوف من عدم الاستمرار يجمع هدفًا صغيرًا ومراجعة العوائق."}],"firstcall":[{"q":"قال الطالب: «أفهم بعض الكلمات، لكن عندما يتحدث زميلي بسرعة لا أفهم الجملة». ما السؤال التالي الأكثر فائدة قبل شرح المنصة؟","o":["هل تريد الاشتراك اليوم؟","في أي مواقف يحدث ذلك؟ وهل تفهم الجملة إذا أعيدت ببطء؟","إذًا مستواك مبتدئ تمامًا."],"e":"السؤال الثاني يميز صعوبة السرعة والفهم السمعي من نقص المفردات، ويساعد على ملاءمة الدرس بدل تصنيف الطالب بسرعة.","a":1},{"q":"الطالب يستطيع تكوين جملة في ذهنه لكنه يتوتر ويتوقف عندما يتحدث. ما أفضل تلخيص لاحتياجه؟","o":["أنت تريد تحويل ما تعرفه إلى كلام بثقة؛ سنراعي ذلك عند اختيار مستوى الدرس.","لا تقلق، ستصبح طليقًا بعد عدة حصص مضمونة.","المشكلة قواعد فقط؛ احفظ القواعد أولًا."],"e":"التلخيص يعترف بفجوة الثقة والتعبير، ويتجنب تشخيصًا محدودًا أو وعدًا بنتيجة غير مضمونة.","a":0},{"q":"قالت الطالبة إنها فوّتت ترقية بسبب اللغة لكنها لم تستمر في معهد سابق. ما خطوتك التالية؟","o":["تخبرها أن فرصة الترقية القادمة مضمونة إذا بدأت.","تسأل ما الذي لم يناسبها سابقًا وما الموقف المهني الذي تريد تحسينه، ثم تلخّص الهدف.","تشرح جميع المزايا فورًا لأنها متحمسة."],"e":"فهم سبب الانقطاع والهدف المهني الفعلي يساعد على خطة واقعية، قبل عرض أي حل أو وعد.","a":1},{"q":"الطالب يريد التحدث بطلاقة خلال أسبوعين، ولديه وقت محدود. كيف تغلق جزء الاستكشاف؟","o":["توافق على المدة كي لا يفقد الحماس.","تلخّص هدفه ووقته، توضّح أن التقدم يحتاج ممارسة منتظمة، وتتأكد أن الدرس التقييمي مناسب.","تغيّر الموضوع إلى سعر الباقة."],"e":"تأكيد الهدف والقيود وإدارة التوقعات يجعل الخطوة التالية مناسبة دون ضمان زمني غير واقعي.","a":1},{"q":"ما المعلومات التي تذكرها في افتتاح المكالمة؟","o":["السعر فقط","نتيجة تقييم لم يحدث بعد","اسمك و51Talk وسبب الاتصال المرتبط بالدرس"],"a":2,"e":"الافتتاح يوضح الهوية وسبب الاتصال قبل استكشاف الحاجة."},{"q":"إذا لم يكن الوقت مناسبًا للطالب، ماذا تفعل؟","o":["تعتبره غير مهتم نهائيًا","تتفق معه على وقت مناسب للتواصل","تتابع الأسئلة دون توقف"],"a":1,"e":"السكريبت يبدأ بالتحقق من مناسبة الوقت؛ احترم إجابته ونظم المتابعة."},{"q":"كيف تستكشف فهم الطالب للمسموع؟","o":["تسأله هل يفهم جملًا كاملة أم يلتقط كلمات","تستنتج مستواه من وظيفته","تسأل عن القراءة فقط"],"a":0,"e":"قسم فهم المستوى يفرق بين فهم الجمل والتقاط الكلمات."},{"q":"طالب يفهم السؤال لكنه ي  without promising a deadline.","a":1},{"q":"What should you include in the call opening?","o":["Only the price","Results of an assessment that has not happened","Your name, 51Talk, and the reason for calling about the lesson"],"a":2,"e":"The opening establishes who you are and why you are calling before exploring needs."},{"q":"What should you do if this is not a good time for the learner?","o":["Treat them as permanently uninterested","Agree on a suitable time to call back","Continue asking questions without stopping"],"a":1,"e":"The script starts by checking whether the time is convenient. Respect the answer and arrange follow-up."},{"q":"How do you explore listening comprehension?","o":["Ask whether they understand full sentences or catch individual words","Infer their level from their job","Ask only about reading"],"a":0,"e":"The current-level section distinguishes understanding sentences from recognizing words."},{"q":"A learner understands questions but takes time to reply. What do you explore?","o":["The price of the package they will buy","Why they have not memorized all grammar rules","How easily they form sentences and organize their thoughts"],"a":2,"e":"Listening comprehension and spoken expression need separate questions."},{"q":"Which question explores writing?","o":["Do you only know the lesson time?","Could you write a short introduction about yourself or your work?","Can you hear individual words?"],"a":1,"e":"The script uses a short introduction to explore comfort with writing."},{"q":"How should you explore previous learning experiences?","o":["Ask what helped, what did not fit, and why they stopped","Immediately criticize their previous platform","Assume they did not make an effort"],"a":0,"e":"Past experiences reveal what supports consistency and what gets in the way."},{"q":"How should you explore time available for learning?","o":["Set a schedule before asking them","Guarantee the same result regardless of available time","Ask about a realistic commitment and the timeframe for their goal"],"a":2,"e":"Available time helps shape a realistic learning plan."},{"q":"What is the right step before explaining the lesson?","o":["Declare a final level after a short call","Summarize the goal, challenge, and available time, then confirm understanding","Send a generic offer and end the call"],"a":1,"e":"The summary connects the next step to the learner's own situation."}],"thirdcall":[{"q":"The learner says the teacher spoke too quickly and the lesson did not help. How do you begin the third call?","o":["Explain the assessment report before hearing details.","Ask how they felt and where speed caused difficulty, acknowledge it, and review the experience.","Tell them their level is the problem."],"e":"The learner’s feedback comes first. Understanding the example and impact builds trust and supports an appropriate follow-up.","a":1},{"q":"The assessment shows strong motivation and hesitation in conversation. Which presentation is best?","o":["Name motivation as a strength, explain hesitation with a specific example, and suggest gradual practice.","Promise the hesitation will disappear in a week.","Start with every error to prove the assessment is detailed."],"e":"The guide starts by building confidence, then explains a development area and a practical path without exaggeration.","a":0},{"q":"The learner understands the general idea but cannot find words to reply quickly. What is the best explanation and next step?","o":["Tell them to memorize long word lists alone.","They understand nothing and must start over.","There is a gap between comprehension and response; link it to practice and repetition before, during, and after lessons."],"e":"The guide separates comprehension from response speed and addresses the gap through regular practice and repetition.","a":2},{"q":"After seeing the report, the learner asks: “Does this mean I am bad at English?” What is the best response?","o":["Yes, so you should enroll now.","The assessment shows where you are, your strengths, and a path toward your goal, including what to develop.","There is nothing to improve."],"e":"An assessment is not a judgment of the person. It balances current level, strengths, goal, and development path.","a":1},{"q":"What should support your comments on strengths and development areas?","o":["Your impression of the learner's age","The same script for every learner","The actual assessment and examples from the lesson"],"a":2,"e":"The third-call summary requires observations supported by the actual assessment."},{"q":"How do you connect pronunciation to the learner's goal?","o":["Promise a perfect accent after one lesson","Discuss examples relevant to situations they need English for","List every pronunciation error without context"],"a":1,"e":"Discuss skills in relation to the goal and available examples from the lesson."},{"q":"A learner forgets words quickly. What is a suitable suggestion?","o":["Review useful words in sentences and conversations","Memorize a long list without using it","Stop speaking until they memorize the dictionary"],"a":0,"e":"The vocabulary response emphasizes practical use and review in context."},{"q":"A learner fears making mistakes. How can you help?","o":["Interrupt every word","Demand a difficult conversation immediately","Start with short conversations, allow thinking time, and gradually increase the challenge"],"a":2,"e":"The anxiety response builds comfort gradually and treats mistakes as part of learning."},{"q":"A learner cannot put a sentence together. Where do you start?","o":["Tell them they are unsuited to learning","Short sentences about relevant situations, then build on them","Advanced grammar without practice"],"a":1,"e":"The sentence-building response starts with simple, meaningful expression."},{"q":"How should you handle limited time?","o":["Check available slots and actual lesson length, then choose a realistic routine","Promise any time without checking","Treat limited time as a final rejection"],"a":0,"e":"The time response connects the schedule to real availability and commitment."},{"q":"When can you promise to send an assessment report?","o":["Always, even if you do not know whether it exists","Only after the learner guarantees enrollment","When it is available and approved, with a clear delivery time"],"a":2,"e":"The summary makes report delivery conditional on availability and approval."},{"q":"A learner fears starting and then stopping. What helps?","o":["Hide the importance of regular practice","A small goal, a suitable schedule, and a review of past obstacles","Guarantee automatic consistency"],"a":1,"e":"The consistency response combines a manageable goal with a review of obstacles."}],"sop":[{"q":"You explained how to book the first three sessions, but the learner says they will do it later. Is the SOP step complete?","o":["Yes, because you explained it.","No; guide them in the app and confirm the bookings appear while they are on the call.","Yes, if you message them later."],"e":"The guide requires completion and verification inside the app during the call, beyond explanation or a future promise.","a":1},{"q":"The learner chose five favorite teachers. What should you verify before moving on?","o":["Confirm favorites are saved in the app, then explain teacher differences and the current points policy.","End the call; the key step is done.","Remembering their names is enough."],"e":"Steps two and three cover saved favorites and the teacher/points explanation. Use the current approved policy wording.","a":0},{"q":"The learner asks about cancellation before a lesson. What is the responsible response?","o":["Say cancellations never affect credits.","Quote a time limit from memory.","Check the current booking and cancellation policy, explain the effect of late cancellation, and confirm understanding."],"e":"The training guide mentions a time rule, but the current policy must be checked before giving a specific limit or deduction.","a":2},{"q":"You explained the learning method and monthly pace, but the learner says their schedule cannot fit it. What next?","o":["Record their acceptance despite the objection.","Ask about available time, discuss a realistic pace under current policy, and document the agreement.","Ignore it and request referrals."],"e":"The goal is a workable commitment. Do not record consent that was not given or promise an unsuitable pace.","a":1},{"q":"Before ending onboarding, what is the strongest evidence the steps were completed?","o":["Verify completion in the app, finish the check-in, and save required proof under the approved process.","Leave verification for another call.","Saying “everything is ready.”"],"e":"The final step links closure to actual verification and documentation, not a verbal assurance.","a":0},{"q":"What is the golden rule in the SOP chart?","o":["Only send a welcome message","Complete and verify the steps while the learner is still on the call","Explain the headings and leave implementation for an unspecified time"],"a":1,"e":"The chart says to complete every point while the client is on the phone."},{"q":"After explaining teacher differences, what should you show in the app?","o":["The available lesson balance so the learner can see it","Only teacher photos","The employee contact list"],"a":0,"e":"Step four shows the available lessons inside the app."},{"q":"What do you explain in step six?","o":["Only the referral code","Employee performance reviews","Where to find pre-lesson questions and post-lesson homework"],"a":2,"e":"Step six connects preparation before the lesson with practice afterward."},{"q":"What explains why the learning plan works in the chart?","o":["Homework without lessons","English use, individual attention, and frequent practice","Memorizing once only"],"a":1,"e":"Part two links the learning approach to English, one-on-one attention, and repetition."},{"q":"What follows the explanation of VIP and referral policies?","o":["Send the referral code and explain its use","Close the account","Repeat the first assessment call"],"a":0,"e":"Steps eight and nine move from explaining the policy to sending the code."},{"q":"What should you explain when introducing the EA department?","o":["That follow-up is finished","A guarantee that no problems will occur","Its role in subsequent follow-up"],"a":2,"e":"Step ten introduces the department that will contact the learner for follow-up."},{"q":"What does the check-in step during the call include?","o":["Leave verification without a time","Complete the check-in and save required proof under the approved procedure","Mark it complete without doing it"],"a":1,"e":"Step twelve covers check-in and required evidence, such as a screenshot under the approved procedure."}],"secondcall":[{"q":"What is the main purpose of the second call?","o":["Prepare the learner technically and mentally before the trial and arrange follow-up","Explain an assessment that has not happened","Collect payment before checking readiness"],"a":0,"e":"The guide focuses on readiness and expectations before the trial lesson."},{"q":"Which route leads to the preparation questions?","o":["Settings → Payment only","Ask for a referral first","Home → Course details → Preview and preparation questions"],"a":2,"e":"This route helps the learner review vocabulary and practice pronunciation before the lesson."},{"q":"The learner is stuck on the email screen. What if Skip is available?","o":["Cancel the lesson immediately","Guide them to skip, then continue sign-in and preparation","Ask for their email password"],"a":1,"e":"The guide uses the available Skip option and then continues app preparation."},{"q":"Which two goals should you explain for the trial lesson?","o":["Experience the learning environment and assess the current level","Master English and buy a package during the lesson","Finish the entire curriculum and receive a certificate"],"a":0,"e":"Explaining both goals sets expectations and encourages participation."},{"q":"A learner is afraid of making mistakes. What should you say?","o":["Speak only when every sentence is perfect","Memorize answers to appear more advanced","Use the English you know; mistakes help us understand your needs"],"a":2,"e":"The guide encourages learners to show their current ability rather than hide difficulties."},{"q":"A learner hesitates to turn on the camera. What is the best response?","o":["Make recording guarantees you cannot verify","Respect their choice and explain permissions and the approved privacy policy","Force them to turn it on without explanation"],"a":1,"e":"The material respects privacy and optional camera use. Explain recording details using the approved policy."},{"q":"Which setting is essential for speaking and assessment in the guide?","o":["A working microphone with permission enabled","Camera on and sound off","All permissions disabled"],"a":0,"e":"The microphone supports spoken interaction; the material presents camera use as optional."},{"q":"The lesson starts at 20:30. When should the learner enter?","o":["20:00","20:35","20:25"],"a":2,"e":"The guide specifies five minutes before the start: 20:30 minus five minutes is 20:25."},{"q":"The learner entered the classroom much too early. What should you do?","o":["Tell them entry time does not matter","Ask them to leave and rejoin at the agreed time, explaining why","Leave them waiting without guidance"],"a":1,"e":"The training scenario corrects early entry and explains the instruction."},{"q":"How do you check the learner understood the entry time?","o":["Ask them to repeat the time in their own words","Say okay and end the call","Assume knowing the lesson start time is enough"],"a":0,"e":"Having the learner repeat the time checks understanding, as in Dania’s example."},{"q":"How should you describe the value of the third call?","o":["Just another call with no clear purpose","A call only for referrals","Review the experience, strengths, development areas, and a goal-related plan"],"a":2,"e":"The source explains concrete value rather than merely naming the assessment call."},{"q":"How can you ask about the payment decision-maker respectfully?","o":["Assume the learner always handles payment","Explain that you want the right person involved in enrollment and payment discussions","Ask for a detailed salary breakdown"],"a":1,"e":"Identifying the decision-maker organizes follow-up without intrusive income questions."},{"q":"When should you mention a direct-enrollment discount?","o":["After checking the available offer and approved terms","Always, even when you do not know whether it exists","As a fixed guarantee that never changes"],"a":0,"e":"The material connects payment questions to learner value; do not promise an unverified offer."},{"q":"The learner is technically ready and gives short answers. What do you shorten?","o":["Remove preparation and decision-maker questions","Read lengthy technical instructions they do not need","Technical explanation time while retaining preparation, goals, and payment questions"],"a":2,"e":"Fahad’s pattern supports a shorter pace without omitting essential elements."},{"q":"What should be added to Dania’s example according to the training comparison?","o":["Ignore camera concerns","The two lesson goals and the assessment follow-up’s value","Remove the technical support she needed"],"a":1,"e":"Dania’s example is strong on guidance and privacy; framing and follow-up value need improvement."},{"q":"Which source rubric element carries 20 points?","o":["Lesson framing: explain the trial and its two goals","The greeting alone","The payment decision-maker alone"],"a":0,"e":"The source weights are 10, 15, 20, 15, 15, 15, and 10, totaling 100."}]},"scripts":{"firstcall":{"ar":"الافتتاح\nالسلام عليكم، معك المستشار التعليمي [اسمك] من 51Talk. حضرتك حاجز معنا درسًا تقييميًا. هل الوقت مناسب لدقيقتين؟ بنتواصل لنتعرف على احتياجك ونساعد في تجهيز تجربة مناسبة لمستواك قدر الإمكان. وبعد الدرس بنراجع تجربتك ونناقش معك الخطوة المناسبة.\n\nفهم المستوى\nكيف بتوصف مستواك حاليًا في الإنجليزية؟ لو شخص حكى معك بالإنجليزية، هل بتفهم الجمل كاملة ولا بتلتقط بعض الكلمات؟ ولما ترد، هل بتقدر تكوّن جمل كاملة ولا بتحتاج وقت لترتب الفكرة؟\n\nالتعبير والراحة\nهل بتحس إن الفكرة واضحة في بالك لكن يصعب عليك التعبير عنها بالإنجليزية؟ وإذا كان الموضوع مناسبًا لك: هل بتحس بتوتر لما تتكلم أو بتفضّل تنهي الحديث بسرعة؟\n\nالقراءة والكتابة\nكيف وضعك مع القراءة، خصوصًا الكلمات الطويلة أو المصطلحات المرتبطة بشغلك؟ ولو طلبنا منك تكتب نبذة قصيرة عن نفسك أو عملك، هل بتكون مرتاح تبدأ؟\n\nالهدف العملي\nوين تحتاج الإنجليزية أكثر: في العمل أو الدراسة أو موقف شخصي؟ وإذا كنت تعمل، ما طبيعة شغلك؟ هل في هدف مهني أو فرصة معيّنة تحب الإنجليزية تساعدك فيها؟ [إذا ذكر الطالب فرصة فاتته، اسأل عن أثرها بدون افتراض أو ضغط.]\n\nالتجارب والوقت\nهل جرّبت تتعلم قبل هيك من منصة أو معهد؟ شو كان مفيدًا، وشو ما ناسبك؟ شو اللي أخّر البدء أو الاستمرار؟ كيف عرفت عن 51Talk؟ وكم وقت تتوقع تقدر تخصصه للتعلّم، وما المدة التي وضعتها لهدفك؟\n\nالتلخيص والانتقال\nخليني أتأكد إني فهمتك: هدفك [الهدف]، والتحدي الأساسي عندك [التحدي]، والوقت المناسب لك [الوقت]. هل هذا صحيح؟ ممتاز. أشرح لك الآن كيف تسير الحصة على 51Talk، وبعدها نراجع نتيجتها معك ونناقش خطة تعلّم مناسبة بناءً على تجربتك وهدفك.","en":"Opening\nHello, this is [your name], an education consultant from 51Talk. You have booked an assessment lesson with us. Is now a good time for a couple of minutes? I am calling to understand your goals and help prepare a lesson that fits your current level as closely as possible. After the lesson, we can review your experience and discuss a suitable next step.\n\nCurrent level\nHow would you describe your English level today? If someone speaks to you in English, do you usually understand full sentences, or do you catch a few words? When you reply, can you form full sentences, or do you need time to put your thoughts together?\n\nSpeaking comfort\nDo you ever find that your ideas are clear in your mind but harder to express in English? If you are comfortable discussing it: do you feel nervous speaking English or prefer to end a conversation quickly?\n\nReading and writing\nHow comfortable are you reading English, especially long words or terms related to your work? If you were asked to write a short introduction about yourself or your work, would it be easy to get started?\n\nPractical goal\nWhere do you need English most: at work, in study, or in a personal situation? If you work, what kind of work do you do? Is there a particular goal or opportunity you hope English will help you with? [If the learner mentions a missed opportunity, ask about its impact without assuming or applying pressure.]\n\nPast learning and time\nHave you learned through a platform or institute before? What helped and what did not suit you? What has made starting or continuing difficult? How did you hear about 51Talk? How much time could you realistically spend learning, and what timeframe do you have in mind for your goal?\n\nSummary and transition\nLet me check that I understood: your goal is [goal], your main challenge is [challenge], and [time] works for your schedule. Is that right? Great. I can now explain how the 51Talk lesson works. Afterward, we can review the lesson with you and discuss a learning plan based on your experience and goal."},"thirdcall":{"ar":"الاستماع — إذا قال الطالب: ما بفهم لما حدا يحكي إنجليزي\nخلينا نحدد من تجربة الدرس شو بتفهم الآن: كلمات منفردة ولا جمل قصيرة؟ بعدها بنختار تدريب استماع يبدأ من مستوى مناسب إلك، ونتابع معك التقدم بالممارسة. إذا احتجت يبطّئ المدرّس الكلام، اطلب منه ذلك أثناء الحصة.\n\nتكوين الجمل — إذا قال: ما بعرف أركّب جملة صح\nبنبدأ بالتعبير بجمل قصيرة عن مواقف تهمك، وبالتدريب بنبني عليها خطوة خطوة. شو أكثر موقف بتحتاج تحكي فيه بالإنجليزية؟\n\nنسيان الكلمات — إذا قال: بنسى الكلمات بسرعة\nخلينا نركز على كلمات تستخدمها فعلاً في عملك أو حياتك، ونراجعها في جمل ومحادثات بدل الاكتفاء بحفظ قائمة. أي موضوع بدك تبدأ فيه؟\n\nالخجل من الكلام — إذا قال: بخاف أغلط\nالخطأ جزء طبيعي من التعلّم. نقدر نبدأ بمحادثات قصيرة ومريحة، ونعطيك وقت ترتب إجابتك، ثم نزيد التحدي تدريجيًا حسب راحتك.\n\nضيق الوقت — إذا قال: ما عندي وقت طويل\nشو الأوقات اللي بتناسب دوامك؟ خلينا نراجع المواعيد ومدة الحصة المتاحة فعلاً، ونختار انتظامًا واقعيًا تقدر تلتزم فيه.\n\nالخوف من عدم الاستمرار — إذا قال: خايف أبدأ وأنسى\nخلينا نتفق على هدف صغير وجدول يناسبك، ونراجع شو ساعدك تستمر أو عطّلك سابقًا. التقدم يحتاج ممارسة منتظمة، ونقدر نعدّل الخطة حسب تجربتك.","en":"Listening — if the learner says: I cannot understand spoken English\nLet us use your trial lesson to see what you understand now: individual words or short sentences? We can then choose listening practice at a suitable starting point and review your progress. If you need the teacher to slow down, ask during the lesson.\n\nBuilding sentences — if they say: I cannot put a sentence together\nWe can begin with short sentences about situations that matter to you and build from there through practice. Where do you most need to speak English?\n\nForgetting words — if they say: I forget new words quickly\nLet us focus on words you actually use at work or in life, then revisit them in sentences and conversations instead of only memorizing a list. Which topic would you like to start with?\n\nSpeaking anxiety — if they say: I am afraid of mistakes\nMistakes are a normal part of learning. We can start with short, comfortable conversations, give you time to form an answer, and increase the challenge as you feel ready.\n\nLimited time — if they say: I do not have much time\nWhich times fit around your work? Let us check the actual lesson length and available slots, then choose a realistic routine you can keep.\n\nWorry about consistency — if they say: I might start and then forget\nLet us agree on a small goal and a schedule that fits you. What helped or hindered you in the past? Progress takes regular practice, and we can adjust the plan based on your experience."},"secondcall":{"ar":"١. الافتتاح\nالسلام عليكم [اسم الطالب]، معك المستشار التعليمي من 51Talk. بتواصل معك لنتأكد إنك جاهز للحصة التجريبية وإن كل شيء واضح قبل ما تبدأ. هل الوقت مناسب لدقيقتين؟\n\n٢. تجهيز التطبيق واختيار الجهاز\nرح تحضر الحصة من تلفون، آيباد أو كمبيوتر؟ إذا متوفر، الأفضل تحضر من شاشة كبيرة مثل الآيباد أو اللابتوب.\nهل حمّلت التطبيق وسجّلت الدخول؟ إذا وقفت عند البريد وكان ظاهر عندك خيار «تخطي / Skip»، ممكن تكمل منه. افتح الصفحة الرئيسية ثم تفاصيل الدورة ثم أسئلة المعاينة والتحضير. اسمع الكلمات وجرّب تسجّل نطقك بالمايك، حتى تكون مرتاح أثناء الحصة.\n\n٣. هدف الحصة\nحصتك تجريبية، وهدفها إنك تتعرف على طريقة التعلم وبيئة الحصة، وكمان نقيّم مستواك الحالي. احكِ بالإنجليزية باللي بتعرفه وخذ راحتك حتى لو أخطأت؛ هذا بيساعدنا نفهم احتياجك ونناقش الخطوة المناسبة بعدين.\n\n٤. الخصوصية\nمن حقك تسأل وتكون مرتاح بخصوص خصوصيتك. حسب الإرشادات التدريبية، ممكن تختار تشغيل الكاميرا أو إغلاقها، لكن مهم المايك يكون شغّال حتى تتواصل مع المعلم. إذا عندك سؤال عن التسجيل أو استخدام الصورة، أوضح لك سياسة الخصوصية المعتمدة قبل الحصة.\n\n٥. تثبيت الدخول\nموعد حصتك [موعد الحصة]، ووقت دخولك المطلوب [وقت الدخول]، يعني قبل الحصة بخمس دقائق. لا تدخل بدري وتنتظر داخل الغرفة؛ وإذا دخلت الآن، اخرج وارجع بالوقت المتفق عليه. حتى أتأكد إن الموعد واضح: بأي ساعة رح تدخل؟\n\n٦. المتابعة بعد الحصة\nبعد الحصة بنتواصل بمكالمة تقييمية: بنسمع رأيك، وبنراجع نقاط قوتك والأمور اللي تحتاج تدريب، وبنناقش خطة تناسب هدفك في حياتك أو شغلك. خلّيك متاح حتى نراجع التجربة معك.\n\n٧. صاحب القرار والختام\nقبل ما أختم، مين عادةً يتولى قرار الاشتراك والدفع؟ بسأل حتى نرتب المتابعة مع الشخص المناسب ونشرح الخيارات المتاحة بوضوح. وأي عرض تسجيل بنذكره حسب الشروط المعتمدة وقتها. بالتوفيق في الحصة، دخولك [وقت الدخول]، وبنتواصل بعدها على خير.","en":"1. Opening\nHello [Learner name], this is your education consultant from 51Talk. I’m calling to check that everything is ready and clear before your trial lesson. Is now a good time for a couple of minutes?\n\n2. App setup and device choice\nWill you attend the lesson on a phone, iPad, or computer? If available, a larger screen such as an iPad or laptop is recommended.\nHave you installed the app and signed in? If you are stopped at the email screen and a Skip option is available, you can use it to continue. Open Home, then Course details, then Preview and preparation questions. Listen to the words and try recording your pronunciation with the microphone to feel more comfortable in the lesson.\n\n3. Lesson goals\nThis is a trial lesson. Its two goals are to introduce the learning environment and assess your current English level. Use the English you know and feel free to make mistakes. That helps us understand your needs and discuss a suitable next step afterward.\n\n4. Privacy\nIt is reasonable to ask about your privacy. Under the training guidance, you may choose whether to use the camera, but the microphone needs to be on so you can speak with the teacher. If you have questions about recording or image use, I can explain the approved privacy policy before the lesson.\n\n5. Entry time\nYour lesson starts at [Lesson time], and you should enter at [Entry time], five minutes beforehand. Please do not enter much earlier and wait inside the room. If you have already entered, leave and rejoin at the agreed time. Just to confirm, what time will you join?\n\n6. Follow-up after the lesson\nWe will call you afterward to hear your feedback, review your strengths and development areas, and discuss a learning plan related to your personal or work goals. Please keep some time available so we can review the experience together.\n\n7. Decision-maker and closing\nBefore we finish, who normally handles the enrollment decision and payment? I ask so we can involve the right person and clearly explain the available options. Any enrollment offer will follow the approved terms available at that time. Enjoy the lesson, join at [Entry time], and we will speak afterward."}}};

function current(){return chapters.find(c=>c.id===chapter)}function lessons(){return extras[chapter]?.[lang]||(lang==='ar'?CURRICULUM.modules.find(m=>m.id===chapter)?.lessons:CURRICULUM.enModules[chapter]?.lessons)||[];}function question(){return (lang==='ar'?CURRICULUM.questions[chapter]:CURRICULUM.enQuestions[chapter])?.[0]}function assessment(){return assessments[chapter]??={ratings:{},employee:'',trainer:'',strength:'',improve:'',action:''};}function timerText(){const m=Math.floor(remaining/60),s=remaining%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}function setTab(v){tab=v;revealed=false;render();}
function render(){const c=current();document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('brandLabel').textContent=t('مساحة التيم ليدر','TEAM LEADER WORKSPACE');$('previewBadge').textContent=t('نموذج تجريبي','PREVIEW');$('languageButton').textContent=t('English','العربية');$('asideTitle').textContent=t('نفس البوابات، دور المدرّب','Your training chapters');$('sidebarNote').textContent=t('اختَر البوابة، ثم اتبع خطوات الجلسة. هذا النموذج لا يغيّر موقع الموظفين.','Choose a chapter, then follow the session steps. This preview does not change the employee site.');$('bannerTag').textContent=t('جلسة تدريب يقودها التيم ليدر','A TEAM LEADER-LED SESSION');$('chapterTitle').textContent=c[lang];$('chapterLead').textContent=t(...c.goal);$('timerLabel').textContent=t('مؤقت الجلسة','SESSION TIMER');$('timerToggle').textContent=running?t('إيقاف','Pause'):t('ابدأ','Start');$('timerReset').textContent=t('إعادة','Reset');timerText();$('previewNote').textContent=t('نسخة تجريبية للمراجعة. التقييم والملاحظات مؤقتة على هذا الجهاز؛ لا تُرسل ولا تُحفظ بعد تحديث الصفحة. التسجيلات تحتاج إنترنت.','Review prototype. Scores and notes stay temporarily on this device; they are not transmitted and reset on refresh. Recordings require internet.');$('portals').innerHTML=chapters.map((p,i)=>`<button class="portal ${p.id===chapter?'active':''}" data-chapter="${p.id}" aria-pressed="${p.id===chapter}"><span>${String(i+1).padStart(2,'0')}</span><div><strong>${esc(p[lang])}</strong><small>${t(...p.use)}</small></div></button>`).join('');const tabs=[['plan','خطة الجلسة','Session plan'],['present','العرض والتفاعل','Present & discuss'],['listen','الاستماع','Listen'],['practice','Role Play','Role Play'],['evaluate','التقييم','Evaluate']];$('tabs').innerHTML=tabs.map(([id,a,e],i)=>`<button class="${tab===id?'active':''}" data-tab="${id}" aria-pressed="${tab===id}">${i+1}. ${t(a,e)}</button>`).join('');$('content').innerHTML=({plan:plan,present:present,listen:listen,practice:practice,evaluate:evaluate})[tab]();document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{chapter=b.dataset.chapter;tab='plan';slide=0;selectedAudio=0;revealed=false;render();});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));bind();}
function plan(){const rows=t([['ابدأ بهدف واضح','اسأل المتدرّب: شو أهم شيء لازم يطلع فيه العميل من هذه المكالمة؟','٣ دقائق'],['راجع واشرح','اعرض فكرة من المنهاج واسأل عن تطبيقها.','٧ دقائق'],['استمع وناقش','اختر تسجيلًا أو مقطعًا، وناقش سلوكًا محددًا فيه.','٥ دقائق'],['طبّق وقيّم','نفّذ Role Play ثم دوّن ملاحظة وخطوة تحسين.','١٠ دقائق']],[['Set a clear goal','Ask: what should the customer gain from this interaction?','3 min'],['Review and explain','Present a curriculum point and discuss its application.','7 min'],['Listen and discuss','Choose a recording or excerpt and discuss a specific behavior.','5 min'],['Practice and evaluate','Run a role play, then record feedback and a next step.','10 min']]);return `<section class="panel"><div class="sectionhead"><h2>${t('خطة جاهزة، وإلك حرية التعديل أثناء الجلسة','A ready-to-use session plan')}</h2><span class="pill">${t('٢٥ دقيقة مقترحة','Suggested · 25 minutes')}</span></div><p class="muted">${t('الوقت مقترح للتجربة؛ اختَر مقطعًا من التسجيل يناسب وقت الجلسة.','Timing is suggested for this preview. Choose a recording excerpt that fits the session.')}</p><div class="goal"><span class="eyebrow">${t('هدف الجلسة','SESSION OUTCOME')}</span><p>${t(...current().goal)}</p></div><div class="agenda">${rows.map(([title,body,time],i)=>`<div><b>${String(i+1).padStart(2,'0')}</b><section><strong>${title}</strong><p>${body}</p></section><small>${time}</small></div>`).join('')}</div><div class="bottom-actions"><button class="button" data-next-tab="present">${t('ابدأ الشرح ←','Start presenting →')}</button><button class="button secondary" data-next-tab="evaluate">${t('افتح بطاقة التقييم','Open scorecard')}</button></div></section>`;}
function present(){const list=lessons();slide=Math.min(slide,list.length-1);const [title,body]=list[slide];const q=question();return `<section class="panel"><div class="sectionhead"><h2>${t('اعرض نقطة، ثم اسأل','Present one point, then ask')}</h2><button class="button secondary" id="displayMode">${t('وضع العرض','Presentation mode')}</button></div><div class="slide"><span class="slide-count">${slide+1} / ${list.length}</span><h2>${esc(title)}</h2><p>${esc(body)}</p></div><div class="slide-controls"><button class="button secondary" id="prevSlide" ${slide===0?'disabled':''}>${t('السابق','Previous')}</button><span class="muted">${t('نقطة من المنهاج الحالي','From the current curriculum')}</span><button class="button" id="nextSlide" ${slide===list.length-1?'disabled':''}>${t('التالي','Next')}</button></div><div class="coach-note"><strong>${t('اسأل المتدرّب: ','Ask the trainee: ')}</strong>${t('كيف بتحوّل هالفكرة لجملة تحكيها للعميل؟','How would you turn this point into something you say to the customer?')}</div></section>${q?`<section class="panel"><div class="sectionhead"><h2>${t('سؤال للنقاش','Discussion question')}</h2><span class="pill">${t('الإجابة تحت تحكّم المدرّب','Trainer-controlled answer')}</span></div><h3>${esc(q.q)}</h3><ol>${q.o.map(o=>`<li>${esc(o)}</li>`).join('')}</ol><button class="button secondary" id="revealAnswer">${revealed?t('إخفاء الإجابة','Hide answer'):t('اكشف الإجابة والتفسير','Reveal answer & explanation')}</button>${revealed?`<div class="answer"><strong>${esc(q.o[q.a])}</strong><p>${esc(q.e)}</p></div>`:''}</section>`:''}`;}
function listen(){const list=recordings[chapter]||[],item=list[Math.min(selectedAudio,list.length-1)];return `<section class="panel"><h2>${t('استمع بهدف، ثم ناقش الدليل','Listen with a purpose')}</h2><p class="muted">${t('اختَر المقطع أثناء الاستماع، ودوّن توقيته لتناقشه مع الموظف.','Choose an excerpt while listening and note its timestamp for discussion.')}</p>${list.length?`<div class="audio-list">${list.map(([label],i)=>`<button data-audio="${i}" class="${selectedAudio===i?'active':''}">${label}</button>`).join('')}</div>${chapter==='firstcall'?`<div class="goal">${t('تسجيل مصطفى موجود في بوابة المكالمة الأولى بالموقع الحالي. افتح الموقع ثم اختَر المكالمة الأولى للاستماع.','Mustafa’s recording is in the First Call chapter on the existing site. Open the site and choose First Call to listen.')}</div><a class="button secondary" href="https://mohammadehab55-rgb.github.io/51talk-training/" target="_blank" rel="noopener">${t('افتح موقع التدريب','Open the training site')}</a>`:chapter==='crm'?`<video controls preload="none" style="width:100%;border-radius:10px" src="https://mohammadehab55-rgb.github.io/51talk-training/${item[1]}"></video>`:`<audio controls preload="none" aria-label="${item[0]}" src="https://mohammadehab55-rgb.github.io/51talk-training/${item[1]}"></audio>`}`:`<div class="goal">${t('لهذه البوابة استخدم نقاش الحالة وتمرين التطبيق؛ لا يوجد تسجيل تقسيط ضمن المواد الحالية.','Use the case discussion and role play for this chapter; the current materials do not include an installments recording.')}</div>`}<div class="listen-points"><div><b>${t('قبل الاستماع','Before listening')}</b><p>${t('شو السلوك المحدد اللي رح نركّز عليه؟','Which specific behavior are we looking for?')}</p></div><div><b>${t('أثناء الاستماع','While listening')}</b><p>${t('لاحظ جملة أو سؤالًا، وحدد توقيته.','Identify an exact statement or question and its timestamp.')}</p></div><div><b>${t('بعد الاستماع','After listening')}</b><p>${t('شو نجح؟ شو بتغيّر؟ أعطِ صياغة بديلة.','What worked? What would you change? Offer an alternative wording.')}</p></div></div><div class="bottom-actions"><button class="button" data-next-tab="practice">${t('انتقل للتطبيق ←','Practice next →')}</button></div></section>`;}
function practice(){return `<section class="panel"><div class="sectionhead"><h2>${t('جرّب المكالمة، قبل المكالمة','Rehearse before the real call')}</h2><span class="pill">${t('٣ دقائق + دقيقتان تغذية راجعة','3 min + 2 min feedback')}</span></div><div class="goal"><strong>${t('الحالة','Scenario')}</strong><p>${t(...current().role)}</p></div><div class="role-grid"><article><span class="eyebrow">${t('دور الموظف','TRAINEE')}</span><h3>${t('أنت المستشار','You are the advisor')}</h3><p>${t('ابدأ الحوار، اسأل قبل ما تشرح، وتحقق من فهم العميل. اختم بخطوة واضحة.','Open the conversation, ask before explaining, and verify understanding. End with a clear next step.')}</p></article><article><span class="eyebrow">${t('دور التيم ليدر','TEAM LEADER')}</span><h3>${t('أنت العميل','You are the customer')}</h3><p>${t('جاوب حسب الحالة، واترك الموظف يقود الحوار. سجّل دليلًا من كلامه بدل مقاطعته بكل ملاحظة.','Respond according to the scenario and let the trainee lead. Note evidence instead of interrupting at every mistake.')}</p></article></div><div class="objection"><button class="button secondary" id="revealObjection">${revealed?t('إخفاء الاعتراض','Hide objection'):t('اكشف اعتراض العميل','Reveal customer objection')}</button>${revealed?`<p>«${t(...current().objection)}»</p>`:`<p class="muted">${t('اكشفه بعد ما يبدأ الموظف الحوار.','Reveal it after the trainee starts the conversation.')}</p>`}</div><div class="bottom-actions"><button class="button" data-next-tab="evaluate">${t('قيّم الأداء ←','Evaluate performance →')}</button></div></section>`;}
function criteria(){return t(['وضوح الافتتاح وتحديد الهدف','أسئلة مناسبة واستماع فعلي','دقة الشرح والتحقق من الفهم','خطوة تالية واضحة وإكمال الإجراء'],['Clear opening and purpose','Relevant questions and active listening','Accurate explanation and comprehension check','Clear next step and completed action']);}function score(){const r=Object.values(assessment().ratings);return {done:r.length,total:Math.round(r.reduce((n,x)=>n+x,0)/8*100)};}function evaluate(){const a=assessment(),s=score(),labels=t(['يحتاج تدريب','جزئي','متقن'],['Needs practice','Partial','Achieved']);return `<section class="panel"><div class="sectionhead"><h2>${t('تقييم مبني على ملاحظة فعلية','Evidence-based feedback')}</h2><span class="pill">${t('بطاقة تجريبية','Sample scorecard')}</span></div><p class="muted">${t('٠ = لم يظهر · ١ = ظهر جزئيًا · ٢ = ظهر بوضوح. مجموع تجريبي للتغذية الراجعة، وليس اعتمادًا رسميًا.','0 = not demonstrated · 1 = partly demonstrated · 2 = clearly demonstrated. This is a sample coaching score, not a formal certification.')}</p><div class="eval-meta"><label>${t('اسم الموظف','Trainee name')}<input data-field="employee" value="${esc(a.employee)}" placeholder="${t('مثال: أحمد','e.g. Alex')}"></label><label>${t('اسم التيم ليدر','Team leader name')}<input data-field="trainer" value="${esc(a.trainer)}"></label></div><div class="ratings">${criteria().map((c,i)=>`<div class="rating-row"><strong>${c}</strong><div class="rating-options">${labels.map((l,j)=>`<button data-criterion="${i}" data-rating="${j}" aria-pressed="${a.ratings[i]===j}" class="${a.ratings[i]===j?'active':''}">${j} · ${l}</button>`).join('')}</div></div>`).join('')}</div><div class="scorebox"><strong>${s.done===4?s.total+' / 100':'— / 100'}</strong><div><b>${s.done===4?t('التقييم مكتمل','Scorecard complete'):t('أكمل المعايير الأربعة','Rate all four criteria')}</b><p>${s.done} / 4 ${t('معايير مقيّمة','criteria rated')}</p></div></div><div class="feedback-fields"><label>${t('نقطة قوة + دليل من المكالمة','Strength + evidence from the call')}<textarea data-field="strength">${esc(a.strength)}</textarea></label><label>${t('نقطة تحسين + صياغة بديلة','Improvement + alternative wording')}<textarea data-field="improve">${esc(a.improve)}</textarea></label></div><label style="margin-top:15px">${t('الإجراء المتفق عليه للجلسة القادمة','Agreed action before the next session')}<textarea data-field="action">${esc(a.action)}</textarea></label><div class="bottom-actions"><button class="button" id="printScore" ${s.done<4?'disabled':''}>${t('طباعة / حفظ التقييم PDF','Print / save scorecard as PDF')}</button></div><p class="muted" style="margin-top:12px">${t('هذه البيانات لا تُرسل لأي جهة. احفظ نسخة PDF إذا أردت الاحتفاظ بالتقييم.','These details are not transmitted. Save a PDF if you want to retain the scorecard.')}</p></section>`;}
function bind(){document.querySelectorAll('[data-next-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.nextTab));if($('nextSlide'))$('nextSlide').onclick=()=>{slide++;render();};if($('prevSlide'))$('prevSlide').onclick=()=>{slide--;render();};if($('revealAnswer'))$('revealAnswer').onclick=()=>{revealed=!revealed;render();};if($('revealObjection'))$('revealObjection').onclick=()=>{revealed=!revealed;render();};if($('displayMode'))$('displayMode').onclick=()=>{presenting=true;document.body.classList.add('presenting');$('exitDisplay').classList.remove('hidden');$('exitDisplay').textContent=t('إنهاء العرض','Exit presentation');window.scrollTo(0,0);};document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>{selectedAudio=Number(b.dataset.audio);render();});document.querySelectorAll('[data-criterion]').forEach(b=>b.onclick=()=>{assessment().ratings[b.dataset.criterion]=Number(b.dataset.rating);render();});document.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>{assessment()[e.dataset.field]=e.value;});if($('printScore'))$('printScore').onclick=()=>{const a=assessment();$('printReport').dir=lang==='ar'?'rtl':'ltr';$('printReport').innerHTML=`<h1>51Talk · ${t('تقرير جلسة التدريب','Training session report')}</h1><p>${esc(current()[lang])}</p><p>${t('الموظف','Trainee')}: ${esc(a.employee||'—')}<br>${t('التيم ليدر','Team leader')}: ${esc(a.trainer||'—')}</p><div class="report-summary">${score().total} / 100 · ${t('نموذج تقييم تدريبي','Training scorecard prototype')}</div><table><tr><th>${t('المعيار','Criterion')}</th><th>${t('التقييم من ٢','Rating out of 2')}</th></tr>${criteria().map((c,i)=>`<tr><td>${c}</td><td>${a.ratings[i]}</td></tr>`).join('')}</table><h3>${t('نقطة القوة','Strength')}</h3><p>${esc(a.strength||'—')}</p><h3>${t('نقطة التحسين','Improvement')}</h3><p>${esc(a.improve||'—')}</p><h3>${t('الخطوة القادمة','Next action')}</h3><p>${esc(a.action||'—')}</p>`;window.print();};}
$('languageButton').onclick=()=>{lang=lang==='ar'?'en':'ar';render();};$('timerToggle').onclick=()=>{running=!running;if(running)deadline=Date.now()+remaining*1000;render();};$('timerReset').onclick=()=>{remaining=1500;running=false;render();};setInterval(()=>{if(!running)return;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));timerText();if(remaining===0){running=false;$('timerToggle').textContent=t('انتهى الوقت','Time is up');}},250);$('exitDisplay').onclick=()=>{presenting=false;document.body.classList.remove('presenting');$('exitDisplay').classList.add('hidden');};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&presenting)$('exitDisplay').click();});render();
</script></body></html>
